<!DOCTYPE html>
<html lang="ta" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code-X AI • by rocky_1029</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { background: #0A0A0A; color: white; font-family: 'Inter', system-ui; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .neon-cyan { text-shadow: 0 0 20px #22d3ee; }
    .btn-3d {
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 10px 30px -10px #22d3ee;
    }
    .btn-3d:active {
      transform: translateY(6px) scale(0.95);
      box-shadow: 0 5px 15px -5px #22d3ee;
    }
    .card-3d {
      transition: all 0.4s ease;
    }
    .card-3d:hover {
      transform: rotateX(15deg) rotateY(15deg) translateZ(30px);
      box-shadow: 0 30px 60px -15px rgba(34, 211, 238, 0.4);
    }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">

  <!-- Navbar -->
  <nav id="navbar" class="glass fixed top-0 w-full z-50 py-4">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-cyan-400 to-purple-500 rounded-xl flex items-center justify-center text-xl font-bold rotate-12">X</div>
        <h1 class="text-2xl font-bold tracking-tighter neon-cyan">CODE-X AI</h1>
      </div>
      <div class="hidden md:flex gap-8 text-sm">
        <a href="#" onclick="navigate('home')" class="hover:text-cyan-400 transition">Home</a>
        <a href="#" onclick="navigate('about')" class="hover:text-cyan-400 transition">About</a>
        <a href="#" onclick="navigate('coaching')" class="hover:text-cyan-400 transition">Coaching</a>
        <a href="#" onclick="navigate('pricing')" class="hover:text-cyan-400 transition">Pricing</a>
      </div>
      <button onclick="showLogin()" class="btn-3d bg-gradient-to-r from-cyan-500 to-purple-600 px-8 py-3 rounded-2xl font-semibold text-sm tracking-wider">LOGIN</button>
    </div>
  </nav>

  <!-- HOME SECTION -->
  <section id="home" class="min-h-screen flex items-center relative">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,#22d3ee10_0%,transparent_70%)]"></div>
    <div class="max-w-7xl mx-auto px-6 pt-24 grid md:grid-cols-2 gap-12 items-center">
      <div class="space-y-8">
        <h1 class="text-6xl md:text-7xl font-bold leading-tight neon-cyan">
          LEVEL UP YOUR<br>LIFE &amp; CODE
        </h1>
        <p class="text-xl text-gray-300 max-w-lg">
          Your personal AI coach powered by advanced intelligence.<br>
          <span class="text-cyan-400">Built by rocky_1029</span>
        </p>
        <button onclick="showLogin()" class="btn-3d text-xl px-12 py-6 rounded-3xl bg-gradient-to-r from-cyan-400 to-purple-500 font-bold tracking-widest hover:scale-105">
          START COACHING NOW →
        </button>
      </div>

      <!-- 3D Logo Area -->
      <div class="relative h-96 flex items-center justify-center">
        <div class="w-80 h-80 bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 rounded-full flex items-center justify-center animate-pulse shadow-2xl shadow-cyan-500/50">
          <div class="text-9xl font-black text-black rotate-12">X</div>
        </div>
        <div class="absolute text-cyan-400 text-2xl font-mono animate-bounce">AI ORB</div>
      </div>
    </div>
  </section>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="glass w-full max-w-md p-10 rounded-3xl">
      <h2 class="text-3xl font-bold text-center mb-8 neon-cyan">CODE-X AI LOGIN</h2>
      
      <input id="username" type="text" placeholder="Username" class="w-full mb-4 bg-black border border-cyan-500/30 rounded-2xl px-6 py-4 focus:outline-none focus:border-cyan-400">
      <input id="password" type="password" placeholder="Password" class="w-full mb-8 bg-black border border-cyan-500/30 rounded-2xl px-6 py-4 focus:outline-none focus:border-cyan-400">
      
      <button onclick="handleLogin()" class="btn-3d w-full py-5 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl font-bold text-lg">LOGIN SECURELY</button>
      
      <p class="text-center text-xs text-gray-500 mt-6">Demo: username = <span class="text-cyan-400">code-x</span><br>password = <span class="text-cyan-400">1234</span></p>
    </div>
  </div>

  <!-- DASHBOARD (After Login) -->
  <div id="dashboard" class="hidden min-h-screen pt-24 bg-black">
    <div class="max-w-5xl mx-auto px-6">
      <h2 class="text-4xl font-bold text-cyan-400 mb-10">Welcome back, Coach <span id="userNameDisplay"></span></h2>

      <div class="grid md:grid-cols-2 gap-8">
        <!-- Profile Setup -->
        <div class="glass p-8 rounded-3xl card-3d">
          <h3 class="text-2xl mb-6">Complete Your Profile</h3>
          <input id="fullName" type="text" placeholder="Your Full Name" class="w-full mb-4 bg-black/50 border border-gray-700 rounded-2xl px-6 py-4">
          <input id="aiFocus" type="text" placeholder="What do you want to improve? (Coding / Life / Career)" class="w-full mb-6 bg-black/50 border border-gray-700 rounded-2xl px-6 py-4">
          <input id="githubToken" type="text" placeholder="GitHub Personal Access Token (optional)" class="w-full mb-6 bg-black/50 border border-gray-700 rounded-2xl px-6 py-4">
          
          <button onclick="generateLink()" class="btn-3d w-full py-6 bg-gradient-to-r from-pink-500 to-purple-600 rounded-3xl font-bold text-xl">GENERATE SHAREABLE LINK</button>
        </div>

        <!-- AI Chat -->
        <div class="glass p-8 rounded-3xl card-3d">
          <h3 class="text-2xl mb-6 flex items-center gap-3"><i class="fas fa-robot"></i> Talk to Code-X AI</h3>
          <div id="chatBox" class="h-80 overflow-y-auto mb-4 bg-black/40 rounded-2xl p-4 space-y-4 text-sm"></div>
          <div class="flex gap-3">
            <input id="chatInput" type="text" placeholder="Ask anything..." class="flex-1 bg-black border border-cyan-500/30 rounded-2xl px-6 py-4">
            <button onclick="sendMessage()" class="btn-3d px-8 bg-cyan-500 rounded-2xl">SEND</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isLoggedIn = false;

    function navigate(section) {
      document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
    }

    function showLogin() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function handleLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user === "code-x" && pass === "1234") {
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('home').classList.add('hidden');
        isLoggedIn = true;
        alert("✅ Login Successful! Welcome to Code-X AI");
      } else {
        alert("worng");
      }
    }

    function generateLink() {
      const name = document.getElementById('fullName').value || "User";
      const token = document.getElementById('githubToken').value;
      
      if (!token) {
        alert("Please enter a GitHub token for shareable link generation");
        return;
      }

      const shareLink = `https://codex-ai.rocks/share/${name.toLowerCase().replace(/\s+/g, '')}-${Date.now()}`;
      alert(`🎉 Shareable Link Generated!\n\n${shareLink}\n\n(Using GitHub Token)`);
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const chatBox = document.getElementById('chatBox');
      
      if (input.value.trim() === "") return;

      chatBox.innerHTML += `<div class="text-right"><span class="inline-block bg-cyan-600 px-5 py-3 rounded-3xl">${input.value}</span></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        chatBox.innerHTML += `<div class="text-left"><span class="inline-block bg-purple-600/80 px-5 py-3 rounded-3xl">Understood. I'm Code-X AI. How can I help you level up today?</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 800);

      input.value = "";
    }

    // Tailwind Script
    tailwind.config = {
      content: [],
      theme: { extend: {} }
    };
  </script>
</body>
</html>
